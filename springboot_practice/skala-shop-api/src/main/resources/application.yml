server:
  port: 8080

spring:
  application:
    name: skala-shop-api

  datasource:
    url: jdbc:h2:mem:shopdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

# Actuator - health / info / metrics 엔드포인트 노출
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: SKALA-SHOP API
    description: 상품/고객/주문을 관리하는 온라인 쇼핑몰 백엔드 REST API
    version: 0.0.1-SNAPSHOT

logging:
  level:
    com.skala.shop: info

shop:
  initial-point: 1000000
