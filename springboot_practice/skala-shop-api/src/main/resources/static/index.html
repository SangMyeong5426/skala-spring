<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKALA-SHOP 온라인 쇼핑몰</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark">🛍️</span>
      <span class="brand-name">SKALA<em>-SHOP</em></span>
    </div>
    <div id="auth-status" class="auth-status">
      <span id="guest-view" class="auth-actions">
        <button id="btn-show-login" class="btn btn-ghost">로그인</button>
        <button id="btn-show-signup" class="btn btn-primary">회원가입</button>
      </span>
      <span id="user-view" class="auth-actions hidden">
        <span class="user-chip"><span class="user-chip-dot"></span><span id="user-info"></span></span>
        <button id="btn-logout" class="btn btn-ghost">로그아웃</button>
      </span>
    </div>
  </div>
</header>

<div class="modal-backdrop hidden" id="modal-backdrop"></div>

<!-- 로그인 -->
<section id="login-panel" class="modal hidden">
  <button class="modal-close" data-close="login-panel" aria-label="닫기">&times;</button>
  <h2>다시 만나서 반가워요</h2>
  <p class="modal-sub">SKALA-SHOP 계정으로 로그인하세요</p>
  <form id="login-form">
    <label class="field">
      <span>고객 ID</span>
      <input type="text" id="login-id" placeholder="예: skala01" required>
    </label>
    <label class="field">
      <span>비밀번호</span>
      <input type="password" id="login-pw" placeholder="비밀번호" required>
    </label>
    <button type="submit" class="btn btn-primary btn-block">로그인</button>
  </form>
</section>

<!-- 회원가입 -->
<section id="signup-panel" class="modal hidden">
  <button class="modal-close" data-close="signup-panel" aria-label="닫기">&times;</button>
  <h2>SKALA-SHOP 시작하기</h2>
  <p class="modal-sub">가입 즉시 1,000,000 P가 적립돼요</p>
  <form id="signup-form">
    <label class="field">
      <span>고객 ID</span>
      <input type="text" id="signup-id" placeholder="사용할 ID" required>
    </label>
    <label class="field">
      <span>비밀번호</span>
      <input type="password" id="signup-pw" placeholder="비밀번호" required>
    </label>
    <button type="submit" class="btn btn-primary btn-block">가입하기</button>
  </form>
</section>

<main>
  <!-- 상품 목록 -->
  <section class="section">
    <div class="section-head">
      <div>
        <h1 class="section-title">오늘의 상품</h1>
        <p class="section-sub">포인트로 바로 주문하고, 마이페이지에서 취소할 수 있어요</p>
      </div>
      <div class="toolbar">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-keyword" placeholder="상품명으로 검색">
        </div>
        <button id="btn-search" class="btn btn-primary">검색</button>
        <button id="btn-refresh" class="btn btn-ghost">새로고침</button>
      </div>
    </div>
    <div id="product-grid" class="product-grid"></div>
  </section>

  <!-- 마이페이지 (로그인 후 표시) -->
  <section id="mypage-panel" class="section hidden">
    <div class="section-head">
      <div>
        <h1 class="section-title">마이페이지</h1>
        <p class="section-sub">보유 포인트와 주문 내역을 확인하세요</p>
      </div>
    </div>

    <div class="point-card">
      <div class="point-label">보유 포인트</div>
      <div class="point-value"><span id="my-point">-</span><span class="point-unit">P</span></div>
    </div>

    <h2 class="subsection-title">주문한 상품</h2>
    <div id="order-list" class="order-list"></div>

    <h2 class="subsection-title">포인트 변동 이력</h2>
    <div class="history-table-wrap">
      <table id="point-history-table" class="history-table">
        <thead>
          <tr><th>사유</th><th>변동액</th><th>변동 후 잔액</th><th>일시</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <div id="toast" class="toast hidden"></div>
</main>

<footer class="site-footer">SKALA-SHOP · Spring Boot 기반 온라인 쇼핑몰 실습 프로젝트</footer>

<script src="/js/app.js"></script>
</body>
</html>
